
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Application | MOTORENT</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f5f5;
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            background: #111;
            color: #fff;
            padding: 22px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        header a {
            color: #fff;
            text-decoration: none;
        }

        .brand {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        main {
            max-width: 720px;
            margin: 65px auto;
            padding: 0 20px;
        }

        .panel {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 32px;
        }

        .eyebrow {
            color: #777;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(28px, 5vw, 42px);
            margin: 12px 0;
        }

        #status {
            display: inline-block;
            background: #eee;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 12px;
        }

        p {
            line-height: 1.7;
            color: #555;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
        }

        .button {
            display: inline-block;
            padding: 13px 18px;
            border: 1px solid #111;
            background: #111;
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .button.secondary {
            background: #fff;
            color: #111;
        }

        #applyForm {
            margin-top: 25px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin: 16px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font: inherit;
        }

        #feedback {
            margin-top: 15px;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .panel {
                padding: 23px;
            }

            header {
                padding: 18px 5%;
            }

            main {
                margin-top: 30px;
            }
        }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="/">MOTORENT</a>
        <a href="/">Back to website ↗</a>
    </header>

    <main>
        <section class="panel">
            <div class="eyebrow">Vendor programme</div>
            <h1 id="title">Your vendor account</h1>
            <p id="message">Checking your account and application status...</p>
            <div id="status">CHECKING</div>

            <div class="actions">
                <a id="dashboardLink" class="button" href="/vendordash.html"
                   hidden>Open vendor dashboard</a>
                <a id="loginLink" class="button" href="/"
                   hidden>Log in</a>
                <a class="button secondary" href="/">Browse vehicles</a>
            </div>

            <form id="applyForm" hidden>
                <h2>Apply to become a vendor</h2>
                <p>Use your existing MOTORENT account. You do not need a separate vendor login.</p>

                <label for="businessName">Business name</label>
                <input id="businessName" name="business_name"
                       maxlength="100" required>

                <label for="location">Business location</label>
                <input id="location" name="location"
                       maxlength="150" required>

                <button class="button" type="submit" style="margin-top:18px">
                    Submit application
                </button>
            </form>

            <p id="feedback" role="status"></p>
        </section>
    </main>

    <script>
        const titleElement = document.getElementById("title");
        const messageElement = document.getElementById("message");
        const statusElement = document.getElementById("status");
        const dashboardLink = document.getElementById("dashboardLink");
        const loginLink = document.getElementById("loginLink");
        const applyForm = document.getElementById("applyForm");
        const feedback = document.getElementById("feedback");

        async function readJson(response) {
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Something went wrong.");
            }

            return data;
        }

        async function loadStatus() {
            try {
                const token = localStorage.getItem("motorent_token");
                const authHeaders = token ? { "Authorization": `Bearer ${token}` } : {};

                const meResponse = await fetch("/api/auth/me", {
                    credentials: "same-origin",
                    headers: authHeaders
                });
                const meData = await readJson(meResponse);

                if (!meData.user) {
                    titleElement.textContent = "Log in to continue";
                    messageElement.textContent =
                        "Sign in to your existing account to apply for vendor access or check an application.";
                    statusElement.textContent = "NOT SIGNED IN";
                    loginLink.hidden = false;
                    applyForm.hidden = true;
                    return;
                }

                if (meData.token) localStorage.setItem("motorent_token", meData.token);

                const response = await fetch("/api/vendor-application-status", {
                    credentials: "same-origin",
                    headers: authHeaders
                });
                const data = await readJson(response);

                if (data.isVendor) {
                    titleElement.textContent = "You're approved";
                    messageElement.textContent =
                        "Your vendor account is active. Use your existing login to manage your vehicles and bookings.";
                    statusElement.textContent = "APPROVED";
                    dashboardLink.hidden = false;
                    applyForm.hidden = true;
                    return;
                }

                if (!data.application) {
                    titleElement.textContent = "Become a vendor";
                    messageElement.textContent =
                        "You are signed in. Submit your business details below to request vendor access.";
                    statusElement.textContent = "NOT APPLIED";
                    applyForm.hidden = false;
                    return;
                }

                applyForm.hidden = true;

                if (data.application.status === "PENDING") {
                    titleElement.textContent = "Application under review";
                    messageElement.textContent =
                        "Your application has been submitted. Check this page again after the administrator reviews it.";
                    statusElement.textContent = "PENDING";
                } else if (data.application.status === "REJECTED") {
                    titleElement.textContent = "Application not approved";
                    messageElement.textContent =
                        "Your application was rejected. You can submit a new application if you wish.";
                    statusElement.textContent = "REJECTED";
                    applyForm.hidden = false;
                } else if (data.application.status === "APPROVED") {
                    titleElement.textContent = "Application approved";
                    messageElement.textContent =
                        "Your approval is recorded. If the dashboard is unavailable, log out and log in again.";
                    statusElement.textContent = "APPROVED";
                    dashboardLink.hidden = false;
                }
            } catch (error) {
                titleElement.textContent = "Unable to check status";
                messageElement.textContent = error.message;
                statusElement.textContent = "ERROR";
            }
        }

        applyForm.addEventListener("submit", async event => {
            event.preventDefault();
            feedback.textContent = "Submitting application...";

            try {
                const token = localStorage.getItem("motorent_token");
                const response = await fetch("/api/vendor-applications", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json",
                        ...(token ? { "Authorization": `Bearer ${token}` } : {})
                    },
                    body: JSON.stringify({
                        business_name: document.getElementById("businessName").value.trim(),
                        location: document.getElementById("location").value.trim()
                    })
                });

                const data = await readJson(response);
                feedback.textContent = data.message || "Application submitted.";
                await loadStatus();
            } catch (error) {
                feedback.textContent = error.message;
            }
        });

        loadStatus();
    </script>
</body>
</html>
