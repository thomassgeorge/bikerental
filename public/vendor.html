
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Rental Partner — Motorent</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background:#090909; color:#f5f5f5; font-family:Arial,sans-serif; margin:0; }
        main { max-width:650px; margin:70px auto; padding:24px; }
        .eyebrow { color:#aaa; letter-spacing:4px; font-size:12px; text-transform:uppercase; }
        h1 { font-size:clamp(38px,7vw,64px); letter-spacing:-2px; line-height:1; }
        p { color:#bbb; line-height:1.6; }
        form { background:#141414; border:1px solid #333; border-radius:12px; padding:24px; }
        label { display:block; margin:18px 0 8px; }
        input { width:100%; box-sizing:border-box; padding:13px; background:#090909; color:white; border:1px solid #444; border-radius:6px; }
        button { margin-top:24px; width:100%; padding:15px; border:0; border-radius:30px; background:white; color:#111; font-weight:bold; font-size:16px; cursor:pointer; }
        a { color:white; }
        #message { padding:12px; margin-top:15px; white-space:pre-wrap; }
    </style>
</head>
<body>
<main>
    <div class="eyebrow">MOTORENT / PARTNERS</div>
    <h1>List your vehicles.</h1>
    <p>Own a rental business? Apply to join Motorent. We review every application and contact you directly before approving your account.</p>

    <form id="applicationForm">
        <label for="name">Your full name</label>
        <input id="name" name="name" maxlength="100" required>

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" maxlength="254" required>

        <label for="phone">Contact number</label>
        <input id="phone" name="phone" type="tel" maxlength="20" required>

        <button type="submit">Submit application</button>
        <div id="message" role="status"></div>
    </form>

    <p><a href="/">← Back to Motorent</a></p>
</main>

<script>
const form = document.getElementById("applicationForm");
const message = document.getElementById("message");
const button = form.querySelector("button");

form.addEventListener("submit", async event => {
    event.preventDefault();
    button.disabled = true;
    message.textContent = "Submitting application...";

    try {
        const data = Object.fromEntries(new FormData(form));

        const response = await fetch("/api/vendor-applications", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Could not submit application.");
        }

        message.textContent =
            "Application submitted successfully. Our team will contact you after reviewing your details.";
        form.reset();
    } catch (error) {
        message.textContent = error.message;
    } finally {
        button.disabled = false;
    }
});
</script>
</body>
</html>
